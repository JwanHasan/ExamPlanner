openapi: 3.0.3

info:
  title: Exam Planner API
  version: 1.0.0
  description: >
    API contract for the Exam Planner web application.
    The API supports authentication, planning-data import, exam scheduling,
    conflict detection, student and examiner assignments, lecturer constraints,
    schedule approval, schedule history, and anonymized export.

servers:
  - url: /api/v1
    description: Exam Planner API Version 1

tags:
  - name: Authentication
  - name: Import
  - name: Classes
  - name: Students
  - name: Exams
  - name: Lecturers
  - name: Schedules

security:
  - bearerAuth: []

paths:

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      description: Authenticates a user using VIA email and password credentials.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current authenticated user
      operationId: getCurrentUser
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /imports:
    post:
      tags:
        - Import
      summary: Import planning data
      description: >
        Uploads an Excel file containing exam-planning data for validation
        and import.
      operationId: importPlanningData
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /classes:
    get:
      tags:
        - Classes
      summary: Get classes
      operationId: getClasses
      parameters:
        - name: courseId
          in: query
          required: false
          schema:
            type: integer
        - name: semester
          in: query
          required: false
          schema:
            type: string
        - name: prefix
          in: query
          required: false
          schema:
            type: string
        - name: includeEnded
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseClass"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /classes/{classId}:
    get:
      tags:
        - Classes
      summary: Get one class
      operationId: getClassById
      parameters:
        - $ref: "#/components/parameters/ClassId"
      responses:
        "200":
          description: Class found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseClass"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /students:
    get:
      tags:
        - Students
      summary: Get students
      operationId: getStudents
      parameters:
        - name: classId
          in: query
          required: false
          schema:
            type: integer
        - name: examId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /students/{studentId}:
    get:
      tags:
        - Students
      summary: Get one student
      operationId: getStudentById
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Student found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /exams:
    get:
      tags:
        - Exams
      summary: Get exams
      operationId: getExams
      parameters:
        - name: classId
          in: query
          required: false
          schema:
            type: integer
        - name: priority
          in: query
          required: false
          schema:
            type: integer
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of exams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exam"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /exams/{examId}:
    get:
      tags:
        - Exams
      summary: Get one exam
      operationId: getExamById
      parameters:
        - $ref: "#/components/parameters/ExamId"
      responses:
        "200":
          description: Exam found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /exams/{examId}/students/{studentId}/eligibility:
    get:
      tags:
        - Exams
        - Students
      summary: Check student exam eligibility
      description: >
        Checks whether the student has a remaining exam attempt and may
        currently be assigned to the exam.
      operationId: getStudentExamEligibility
      parameters:
        - $ref: "#/components/parameters/ExamId"
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Eligibility result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamEligibility"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /exams/{examId}/students/{studentId}:
    put:
      tags:
        - Exams
        - Students
      summary: Assign student to exam
      operationId: assignStudentToExam
      parameters:
        - $ref: "#/components/parameters/ExamId"
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentExamAssignmentRequest"
      responses:
        "200":
          description: Student assigned to exam
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentExamAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Student cannot be assigned because a business rule is violated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      tags:
        - Exams
        - Students
      summary: Remove student from exam
      operationId: removeStudentFromExam
      parameters:
        - $ref: "#/components/parameters/ExamId"
        - $ref: "#/components/parameters/StudentId"
      responses:
        "204":
          description: Student removed from exam
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /exams/{examId}/hand-ins:
    get:
      tags:
        - Exams
      summary: Get exam hand-in deadlines
      operationId: getExamHandIns
      parameters:
        - $ref: "#/components/parameters/ExamId"
      responses:
        "200":
          description: Hand-in deadlines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HandIn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /lecturers:
    get:
      tags:
        - Lecturers
      summary: Get lecturers
      operationId: getLecturers
      responses:
        "200":
          description: List of lecturers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lecturer"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /lecturers/{lecturerId}:
    get:
      tags:
        - Lecturers
      summary: Get one lecturer
      operationId: getLecturerById
      parameters:
        - $ref: "#/components/parameters/LecturerId"
      responses:
        "200":
          description: Lecturer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lecturer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /exams/{examId}/examiners/{lecturerId}:
    put:
      tags:
        - Exams
        - Lecturers
      summary: Assign examiner to exam
      operationId: assignExaminer
      parameters:
        - $ref: "#/components/parameters/ExamId"
        - $ref: "#/components/parameters/LecturerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExaminerAssignmentRequest"
      responses:
        "200":
          description: Examiner assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExaminerAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Exams
        - Lecturers
      summary: Remove examiner from exam
      operationId: removeExaminer
      parameters:
        - $ref: "#/components/parameters/ExamId"
        - $ref: "#/components/parameters/LecturerId"
      responses:
        "204":
          description: Examiner removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /lecturers/{lecturerId}/constraints:
    get:
      tags:
        - Lecturers
      summary: Get lecturer constraints
      operationId: getLecturerConstraints
      parameters:
        - $ref: "#/components/parameters/LecturerId"
      responses:
        "200":
          description: Lecturer constraints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LecturerConstraint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags:
        - Lecturers
      summary: Create lecturer constraint
      operationId: createLecturerConstraint
      parameters:
        - $ref: "#/components/parameters/LecturerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLecturerConstraintRequest"
      responses:
        "201":
          description: Lecturer constraint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LecturerConstraint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /lecturers/{lecturerId}/constraints/{constraintId}:
    patch:
      tags:
        - Lecturers
      summary: Update lecturer constraint
      operationId: updateLecturerConstraint
      parameters:
        - $ref: "#/components/parameters/LecturerId"
        - $ref: "#/components/parameters/ConstraintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLecturerConstraintRequest"
      responses:
        "200":
          description: Constraint updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LecturerConstraint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Lecturers
      summary: Delete lecturer constraint
      operationId: deleteLecturerConstraint
      parameters:
        - $ref: "#/components/parameters/LecturerId"
        - $ref: "#/components/parameters/ConstraintId"
      responses:
        "204":
          description: Constraint deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedules:
    get:
      tags:
        - Schedules
      summary: List schedules
      operationId: getSchedules
      responses:
        "200":
          description: Schedule summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - Schedules
      summary: Create or generate schedule
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /schedules/current:
    get:
      tags:
        - Schedules
      summary: Get current schedule
      operationId: getCurrentSchedule
      responses:
        "200":
          description: Current schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No current schedule exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /schedules/{scheduleId}:
    get:
      tags:
        - Schedules
      summary: Get schedule
      operationId: getScheduleById
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "200":
          description: Schedule found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedules/{scheduleId}/conflicts:
    get:
      tags:
        - Schedules
      summary: Scan schedule for conflicts
      operationId: scanScheduleConflicts
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "200":
          description: Conflict scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedules/{scheduleId}/sessions/{sessionId}:
    patch:
      tags:
        - Schedules
      summary: Reschedule exam session
      operationId: rescheduleExamSession
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleExamRequest"
      responses:
        "200":
          description: Exam session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: New date violates a scheduling rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /schedules/{scheduleId}/sessions/{sessionId}/lock:
    patch:
      tags:
        - Schedules
      summary: Lock or unlock exam session
      operationId: setExamSessionLock
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionLockRequest"
      responses:
        "200":
          description: Lock state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionLockResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedules/{scheduleId}/rebuild:
    post:
      tags:
        - Schedules
      summary: Rebuild affected schedule
      operationId: rebuildSchedule
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebuildScheduleRequest"
      responses:
        "200":
          description: Schedule rebuilt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRebuildResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /schedules/{scheduleId}/approve:
    post:
      tags:
        - Schedules
      summary: Approve schedule
      operationId: approveSchedule
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "200":
          description: Schedule approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleApprovalResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Schedule cannot be approved while blocking conflicts remain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /schedules/{scheduleId}/versions:
    get:
      tags:
        - Schedules
      summary: Get schedule versions
      operationId: getScheduleVersions
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "200":
          description: Schedule versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleVersionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedules/{scheduleId}/versions/{version}:
    get:
      tags:
        - Schedules
      summary: Get specific schedule version
      operationId: getScheduleVersion
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Schedule version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /schedules/{scheduleId}/export:
    get:
      tags:
        - Schedules
      summary: Export anonymized schedule
      operationId: exportSchedule
      parameters:
        - $ref: "#/components/parameters/ScheduleId"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - xlsx
            default: xlsx
      responses:
        "200":
          description: Anonymized schedule file
          headers:
            Content-Disposition:
              description: Suggested downloaded filename
              schema:
                type: string
                example: attachment; filename="exam-schedule-anonymized.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Schedule could not be safely anonymized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    ClassId:
      name: classId
      in: path
      required: true
      schema:
        type: integer

    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: integer

    ExamId:
      name: examId
      in: path
      required: true
      schema:
        type: integer

    LecturerId:
      name: lecturerId
      in: path
      required: true
      schema:
        type: integer

    ConstraintId:
      name: constraintId
      in: path
      required: true
      schema:
        type: integer

    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: integer

    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer

  responses:

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Forbidden:
      description: Authenticated user does not have permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    Conflict:
      description: Request conflicts with a business or scheduling rule
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    UnsupportedMediaType:
      description: Unsupported media or file type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    UnprocessableEntity:
      description: Request structure is valid but its data cannot be processed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:

    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: STUDENT_OVERLAP
        message:
          type: string
          example: The selected date creates a student exam conflict.
        details:
          type: object
          additionalProperties: true

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@via.dk
        password:
          type: string
          format: password
          example: example-password

    LoginResponse:
      type: object
      required:
        - accessToken
        - expiresAt
        - user
      properties:
        accessToken:
          type: string
          example: jwt-token
        expiresAt:
          type: string
          format: date-time
          example: "2026-09-14T16:00:00Z"
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthUser:
      type: object
      required:
        - id
