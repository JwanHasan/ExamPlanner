services:
  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    image: examplanner-migrations:${APP_VERSION:-dev}
    build:
      context: ./Server
      dockerfile: DatabaseConnection/Dockerfile.migrations

    container_name: exam_migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

  api:
    image: examplanner-api:${APP_VERSION:-dev}
    build:
      context: ./Server
      dockerfile: ExamPlannerServer/Dockerfile
    container_name: exam_planner_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
  website:
    build:
      context: ./Website/exam-planner-app
      dockerfile: Dockerfile
    image: exam-planner-website:${APP_VERSION:-dev}
    ports:
      - "4040:4040"
    command: npm run dev -- --config vite.docker.config.ts --host 0.0.0.0 --port 4040
volumes:
  postgres_data:
