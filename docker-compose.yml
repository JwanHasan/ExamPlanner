services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=viaviavia
      - POSTGRES_DB=ExamPlanner

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ExamPlanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: ./Server
      dockerfile: DatabaseConnection/Dockerfile.migrations

    container_name: exam_migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ExamPlanner;Username=postgres;Password=viaviavia"
  api:
    build:
      context: ./Server
      dockerfile: ExamPlannerServer/Dockerfile

    container_name: exam_planner_api
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ExamPlanner;Username=postgres;Password=viaviavia"

    depends_on:
      - postgres

volumes:
  postgres_data:
